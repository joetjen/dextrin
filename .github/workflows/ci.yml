name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  precommit:
    name: mix precommit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Reads erlang/elixir versions straight from .tool-versions, so CI
      # and local dev can never silently drift onto different versions.
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore deps/_build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      # Mirrors `mix precommit`'s alias list (mix.exs) one command per
      # step, fast/cheap checks first, so a broken commit fails quickly
      # and the GitHub UI shows exactly which check failed. Keep this
      # list in sync with the `precommit` alias if that ever changes.
      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Sobelow
        run: mix sobelow

      - name: Test
        run: mix test

      - name: Dialyzer
        run: mix dialyzer
